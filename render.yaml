# Render Blueprint: free Python web service for the podcast app.
#
# The database lives in Turso (see README, "Deploy (Render + Turso)")
# because Render's free tier wipes local files on every redeploy,
# restart and spin-down, so a local SQLite file would not survive.
# TURSO_DATABASE_URL and TURSO_AUTH_TOKEN are declared with sync: false,
# so their values are set in the Render dashboard, never in this file.
#
# The Fly.io files (Dockerfile, fly.toml) are a separate deploy path
# and are left in place, untouched.

services:
  - type: web
    name: podcast-app
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: python backend/app.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "20.0.0"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

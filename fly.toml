app = "podcast-app-boop"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PODCAST_DB = "/data/podcasts.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume: subscriptions, positions and queue survive
# restarts and redeploys. Create it once with:
#   flyctl volumes create podcast_data --size 1 --region yyz
[[mounts]]
  source = "podcast_data"
  destination = "/data"
